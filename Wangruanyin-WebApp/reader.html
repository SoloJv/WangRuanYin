<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网软音 · Wangruanyin — Opening…</title>
  <link rel="icon" type="image/png" href="wangruanyin.png">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; background: #eef1f5; color: #244d7d;
    }
    .open-box { text-align: center; font-size: 15px; max-width: 560px; padding: 0 20px; line-height: 1.6; }
    .spinner {
      display: inline-block; width: 18px; height: 18px; margin-right: 10px; vertical-align: -4px;
      border: 3px solid #cfe0f1; border-top-color: #244d7d; border-radius: 50%;
      animation: wryspin .8s linear infinite;
    }
    @keyframes wryspin { to { transform: rotate(360deg); } }
    a { color: #1f5fa6; }
  </style>
</head>
<body>
  <div class="open-box">
    <div id="msg"><span class="spinner"></span>Opening the website in this tab…</div>
    <p style="font-size:13px;color:#666;">The real site loads directly — the web app never fetches or re-renders it.
      To annotate it, use the app's <strong>🌐 Website viewer</strong> on the index page instead.</p>
    <p style="font-size:13px;"><a id="openLink" href="#">Open manually</a></p>
  </div>
  <script>
    (function () {
      var url = new URLSearchParams(location.search).get('url') || '';
      var link = document.getElementById('openLink');
      var msg = document.getElementById('msg');
      if (!url) {
        msg.innerHTML = 'No address given.';
        link.href = 'index.html';
        link.textContent = 'Back to the web app';
      } else {
        link.href = url;
        location.replace(url);
      }
    })();
  </script>
</body>
</html>
