# Deploy the Wangruanyin web app to GitHub Pages.
# The site is served at: https://solojv.github.io/WangRuanYin/
#
# To enable (ONE-TIME, must be done by the repo owner in the GitHub UI):
#   Repo Settings → Pages → Source: "GitHub Actions" → Save.
# If this workflow fails on the "Check GitHub Pages is enabled" / "Setup Pages"
# step, Pages is not enabled yet — do the step above, then re-run the workflow.
#
# Until Pages is enabled the web app still works: the bookmarklet generated by
# the index page falls back to the jsDelivr CDN (repo just needs to be public).
name: Deploy Web App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GET /pages -> $status"
          if [ "$status" != "200" ]; then
            echo "::error::GitHub Pages is NOT enabled for this repository."
            echo "::error::Open the repo on github.com → Settings → Pages → Source: \"GitHub Actions\" → Save, then re-run this workflow."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole Wangruanyin-WebApp folder becomes the site root,
          # so index.html + engine files are served at the Pages URL.
          path: Wangruanyin-WebApp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
