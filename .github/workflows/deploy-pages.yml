# Deploy the Wangruanyin web app to GitHub Pages.
# The site is served at: https://solojv.github.io/WangRuanYin/
#
# This workflow FIRST tries to ENABLE GitHub Pages automatically via the REST
# API, using the workflow token. If it cannot (e.g. 403 - the token lacks the
# Pages permission), it aborts with an actionable message and the repo owner
# must complete it manually:
#   Repo Settings → Pages → Source: "GitHub Actions" → Save → re-run.
#
# Automatic enabling also works if you add a repo secret named PAGES_PAT:
# a classic PAT (Settings → Developer settings → Personal access tokens →
# Tokens (classic)) with the "repo" scope, or a fine-grained PAT with
# "Pages: write" (and "Administration: read").
#
# Until Pages is enabled the web app still works: the bookmarklet generated by
# the index page falls back to the jsDelivr CDN (repo just needs to be public).
name: Deploy Web App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable or verify GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          set +e
          TOKEN="${PAGES_PAT:-$GH_TOKEN}"
          AUTH="Authorization: Bearer ${TOKEN}"
          APJSON="Accept: application/vnd.github+json"
          REPO="${{ github.repository }}"

          # 1) Already enabled?
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" -H "$APJSON" "https://api.github.com/repos/${REPO}/pages")
          echo "GET  /pages -> $code"
          if [ "$code" = "200" ]; then
            echo "GitHub Pages is already enabled."
            exit 0
          fi

          # 2) Try to enable it (works if the token holds the Pages permission).
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "$AUTH" -H "$APJSON" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${REPO}/pages")
          echo "POST /pages -> $code"
          echo "response: $(cat /tmp/pages.json)"
          if [ "$code" = "201" ] || [ "$code" = "202" ] || [ "$code" = "204" ]; then
            echo "GitHub Pages enabled automatically. Waiting for it to become ready…"
            sleep 15
            exit 0
          fi

          # 3) Could not enable it automatically.
          echo "::error::GitHub Pages is NOT enabled for this repository and could not be enabled automatically (POST /pages -> $code)."
          echo "::error::Manual step (repo owner, ~10 seconds): open https://github.com/${REPO}/settings/pages → Build and deployment → Source: \"GitHub Actions\" → Save."
          echo "::error::Automatic enabling needs a token with the Pages permission. Add a repo secret PAGES_PAT (classic PAT with \"repo\" scope) and re-run, or do the manual step above."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole Wangruanyin-WebApp folder becomes the site root,
          # so index.html + engine files are served at the Pages URL.
          path: Wangruanyin-WebApp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
